<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rendimiento Diario</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">

<style>

*{
box-sizing:border-box;
font-family:system-ui;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#001a3a,#007bff,#ff2d95);
background-size:300% 300%;
animation:bgmove 10s infinite;
color:white;
}

@keyframes bgmove{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

.container{
width:100%;
max-width:420px;
padding:20px;
}

h1{
text-align:center;
margin:5px 0;
}

.fecha{
text-align:center;
opacity:.8;
font-size:14px;
}

.total{
text-align:center;
font-size:42px;
margin:20px 0;
color:#ff2d95;
font-weight:bold;
}

.controls{
display:flex;
gap:10px;
margin-bottom:15px;
}

.controls input,
.controls button{
flex:1;
height:48px;
border-radius:10px;
border:none;
font-size:16px;
}

input{
padding-left:10px;
}

button{
background:#00aaff;
color:white;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.96);
}

ul{
list-style:none;
padding:0;
margin:0;
display:flex;
flex-direction:column;
gap:8px;
max-height:50vh;
overflow:auto;
}

li{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.1);
padding:10px;
border-radius:10px;
}

.valor{
font-size:18px;
}

.acciones{
display:flex;
gap:12px;
font-size:14px;
}

.editar{
color:#7dd3fc;
cursor:pointer;
}

.eliminar{
color:#ff6b9d;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>Rendimiento Diario</h1>

<div class="fecha" id="fecha"></div>

<div class="total" id="total">0</div>

<div class="controls">
<input type="number" id="valor" placeholder="Ingresar Rendimiento">
<button id="boton" onclick="accion()">Agregar</button>
</div>

<ul id="historial"></ul>

</div>

<script>

const hoy = new Date().toLocaleDateString()
document.getElementById("fecha").textContent = hoy

let editIndex = null

let datos = JSON.parse(localStorage.getItem("registro")) || {
fecha:hoy,
historial:[]
}

if(datos.fecha !== hoy){
datos = {
fecha:hoy,
historial:[]
}
}

const historialUI = document.getElementById("historial")
const totalUI = document.getElementById("total")
const boton = document.getElementById("boton")
const input = document.getElementById("valor")

function guardar(){
localStorage.setItem("registro",JSON.stringify(datos))
}

function calcularTotal(){
return datos.historial.reduce((a,b)=>a+b,0)
}

function actualizar(){

historialUI.innerHTML=""

datos.historial.forEach((valor,index)=>{

const li=document.createElement("li")

li.innerHTML=`
<span class="valor">${valor}</span>

<div class="acciones">
<span class="editar" onclick="editar(${index})">Editar</span>
<span class="eliminar" onclick="eliminar(${index})">Eliminar</span>
</div>
`

historialUI.appendChild(li)

})

totalUI.textContent = calcularTotal()

guardar()

}

function accion(){

const num = Number(input.value)

if(!num) return

if(editIndex === null){

datos.historial.push(num)

}else{

datos.historial[editIndex] = num
editIndex = null
boton.textContent = "Agregar"

}

input.value=""

actualizar()

}

function editar(i){

input.value = datos.historial[i]
input.focus()

editIndex = i
boton.textContent = "Actualizar"

}

function eliminar(i){

const seguro = confirm("¿Seguro que quieres eliminar este registro 🏎️?")

if(!seguro) return

datos.historial.splice(i,1)

actualizar()

}

actualizar()

</script>

</body>

</html>
