<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rendimiento Diario</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#001a3a,#007bff,#ff2d95);
    background-size:300% 300%;
    animation:gradientMove 8s ease infinite;
    color:white;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:18px;
    width:360px;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.fecha{
    text-align:center;
    font-size:14px;
    opacity:0.8;
}

.total{
    font-size:42px;
    text-align:center;
    margin:20px 0;
    color:#ff2d95;
    font-weight:bold;
    transition:0.3s;
}

.total.flash{
    transform:scale(1.1);
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:16px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:6px;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

.add{
    background:#00aaff;
    color:white;
}

.edit{
    background:#ff2d95;
    color:white;
}

ul{
    margin-top:20px;
    padding:0;
    list-style:none;
    max-height:150px;
    overflow:auto;
}

li{
    background:rgba(255,255,255,0.08);
    padding:8px;
    border-radius:6px;
    margin-bottom:6px;
}

</style>
</head>

<body>

<div class="container">

<h1>Registro Diario</h1>
<div class="fecha" id="fecha"></div>

<div class="total" id="total">0</div>

<input type="number" id="valor" placeholder="Ingresar rendimiento">

<button class="add" onclick="agregar()">Agregar</button>
<button class="edit" onclick="editarTotal()">Editar Total</button>

<ul id="historial"></ul>

</div>

<script>

const hoy = new Date().toLocaleDateString()

document.getElementById("fecha").textContent = hoy

let datos = JSON.parse(localStorage.getItem("registroDiario")) || {
    fecha:hoy,
    total:0,
    historial:[]
}

if(datos.fecha !== hoy){
    datos = {
        fecha:hoy,
        total:0,
        historial:[]
    }
}

const totalUI = document.getElementById("total")
const historialUI = document.getElementById("historial")

function guardar(){
    localStorage.setItem("registroDiario",JSON.stringify(datos))
}

function actualizar(){

    totalUI.textContent = datos.total

    totalUI.classList.add("flash")
    setTimeout(()=>totalUI.classList.remove("flash"),200)

    historialUI.innerHTML=""

    datos.historial.forEach(v=>{
        const li=document.createElement("li")
        li.textContent="+ "+v
        historialUI.appendChild(li)
    })

    guardar()
}

function agregar(){

    const input=document.getElementById("valor")
    const num=Number(input.value)

    if(!num) return

    datos.total+=num
    datos.historial.push(num)

    input.value=""

    actualizar()
}

function editarTotal(){

    const nuevo=prompt("Editar total:",datos.total)

    if(nuevo===null) return

    datos.total=Number(nuevo)

    actualizar()
}

actualizar()

</script>

</body>
</html>
